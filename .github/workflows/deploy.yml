name: Deploy

# WHEN this pipeline runs.
on:
  push:
    branches: [main]        # every push to main deploys
  workflow_dispatch:         # plus a manual "Run workflow" button in the Actions tab

# Never let two deploys overwrite each other. A second push waits for the first
# to finish rather than cancelling it mid-rsync and leaving a half-copied site.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- CI
  # Runs on GitHub's machine. Touches nothing on your server.
  # If this fails, the deploy job below never starts.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Health check
        run: node scripts/healthcheck.mjs

  # ---------------------------------------------------------------- CD
  deploy:
    name: Deploy
    needs: verify              # gate: only runs if `verify` succeeded
    runs-on: ubuntu-latest
    env:
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}

    steps:
      - uses: actions/checkout@v4

      - name: Guard against an unsafe deploy path
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$DEPLOY_PATH" ]; then
            echo "DEPLOY_PATH secret is not set"; exit 1
          fi
          case "$DEPLOY_PATH" in
            /|/root|/home|/var|/usr|/etc)
              echo "refusing to rsync --delete into $DEPLOY_PATH"; exit 1 ;;
          esac
          echo "deploy path ok: $DEPLOY_PATH"

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS not set, trusting the host on first sight"
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Upload site
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude 'node_modules' \
            --exclude 'assets/source' \
            --exclude 'scripts' \
            --exclude 'logs' \
            --exclude 'package-lock.json' \
            --exclude '*.md' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Reload pm2
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && mkdir -p logs && \
             (pm2 reload abtin-portfolio --update-env || pm2 start ecosystem.config.cjs) && \
             pm2 save"

      - name: Smoke test the live site
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL not set, skipping smoke test"; exit 0
          fi
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "live site returned 200"; exit 0
            fi
            echo "attempt $i: got $code, retrying in 3s"; sleep 3
          done
          echo "site did not return 200 after deploy"; exit 1

      - name: Remove the deploy key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
